[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gohc-client"
version = "0.1.0"
description = "Lightweight file-based health reports for gohc"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Ramazan Bagaev"}]
dependencies = []

[project.urls]
Repository = "https://github.com/ramazan-bagaev/gohc"

[tool.setuptools]
packages = ["gohc"]
